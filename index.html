<!DOCTYPE html>
<html lang="en">
<!-- Error reporting script for debugging -->
<script>
    window.addEventListener('error', function (event) {
        var msg = event.message || "Unknown Error";
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed; top:0; left:0; background:red; color:white; z-index:10000; padding:10px; font-weight:bold; white-space:pre-wrap;';
        div.innerText = "Global Error: " + msg + "\nAt: " + event.filename + ":" + event.lineno;
        document.body.appendChild(div);
    });
    window.addEventListener('unhandledrejection', function (event) {
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed; top:50px; left:0; background:darkred; color:white; z-index:10000; padding:10px; font-weight:bold; white-space:pre-wrap;';
        div.innerText = "Unhandled Promise Rejection: " + event.reason;
        document.body.appendChild(div);
    });
</script>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        window.BlazorDownloadFile = (fileName, contentType, content) => {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        }

        Blazor.start().then(function () {
            var loading = document.querySelector('.loading-progress');
            if (loading) loading.style.display = 'none';
        }).catch(function (error) {
            var msg = error.message || "Unknown Blazor Start Error";
            var div = document.createElement('div');
            div.style.cssText = 'position:fixed; top:100px; left:0; background:purple; color:white; z-index:10000; padding:10px; font-weight:bold; white-space:pre-wrap;';
            div.innerText = "Blazor Start Error: " + msg + "\n" + (error.stack || "");
            document.body.appendChild(div);
            console.error(error);
        });
    </script>
</body>
