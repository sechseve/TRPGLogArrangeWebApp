<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRPGLogArrangeTool (v3)</title>
    <base href="/TRPGLogArrangeWebApp/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TRPGLogArrangeTool.Blazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="padding:20px; text-align:center;">
            <h3>Loading...</h3>
            <div id="status-debug" style="color:gray; font-size:0.8em;">Waiting for Blazor...</div>
        </div>
    </div>

    <div id="blazor-error-ui"
        style="display:none; position:fixed; bottom:0; width:100%; background:yellow; color:black; padding:10px; z-index:1000;">
        An error occurred. <a href="." class="reload">Reload</a>
    </div>

    <script>
        // Emergency logging
        window.onclick = function () { document.getElementById('status-debug').innerText = 'Starting...'; };

        window.onerror = function (msg, url, line) {
            var div = document.createElement('div');
            div.style.cssText = 'position:fixed;top:0;left:0;background:red;color:white;z-index:9999;padding:10px;width:100%;word-break:break-all;';
            div.innerText = 'JS ERR: ' + msg + '\nAt: ' + url + ':' + line;
            document.body.appendChild(div);
        };
    </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
