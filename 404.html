<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRPGLogArrangeTool.Blazor</title>
    <base href="/TRPGLogArrangeWebApp/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TRPGLogArrangeTool.Blazor.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Error reporting for runtime exceptions -->
    <script>
        window.addEventListener('error', function (event) {
            var msg = event.message || "Unknown Error";
            var div = document.createElement('div');
            div.style.cssText = 'position:fixed; top:0; left:0; background:purple; color:white; z-index:10000; padding:10px; font-weight:bold; white-space:pre-wrap;';
            div.innerText = "Runtime Error: " + msg + "\nAt: " + (event.filename || "unknown") + ":" + (event.lineno || "0");
            document.body.appendChild(div);
        });
        window.addEventListener('unhandledrejection', function (event) {
            var div = document.createElement('div');
            div.style.cssText = 'position:fixed; top:50px; left:0; background:darkmagenta; color:white; z-index:10000; padding:10px; font-weight:bold; white-space:pre-wrap;';
            div.innerText = "Unhandled Promise: " + event.reason;
            document.body.appendChild(div);
        });
    </script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.BlazorDownloadFile = (fileName, contentType, content) => {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
